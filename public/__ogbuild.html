<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#000;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  #stage{position:relative;width:1200px;height:630px;overflow:hidden;background:#0a0a0c}
  canvas{position:absolute;image-rendering:pixelated}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:74px;height:74px;border-radius:14px;image-rendering:pixelated}
  .brand .nm{font-size:40px;letter-spacing:-0.01em;font-weight:600;white-space:nowrap}
  .brand .nm b{color:#fef3c7;font-weight:700}
  .brand .nm span{color:#9ca3af;font-weight:500}
  .tag{color:#a1a1aa;font-size:26px;line-height:1.4}
  .url{font-size:22px;color:#71717a;letter-spacing:0.03em}
  .chips{display:flex;gap:12px}
  .chips span{border:1px solid #52340a;color:#fcd34d;font-size:20px;padding:7px 17px;border-radius:999px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ===== Ported verbatim from src/App.jsx (palette-mode dither + atmosphere) ===== */
const B2=[[0,2],[3,1]];
function genBayer(order){let m=[[0]],s=1;while(s<order){const ns=s*2,nm=Array.from({length:ns},()=>Array(ns).fill(0));
  for(let y=0;y<ns;y++)for(let x=0;x<ns;x++)nm[y][x]=4*m[y%s][x%s]+B2[Math.floor(y/s)][Math.floor(x/s)];m=nm;s=ns;}return m;}
const DIAMOND_8X8=[[0,1,2,3,4,5,6,7],[1,0,1,2,3,4,5,0],[2,3,0,1,2,3,0,1],[3,4,5,0,1,0,1,2],[4,5,6,7,0,1,2,3],[3,4,5,0,1,0,1,2],[2,3,0,1,2,3,0,1],[1,0,1,2,3,4,5,0]];
const ORDERED_PATTERNS={bayer2:{matrix:genBayer(2),size:2,max:4},bayer:{matrix:genBayer(4),size:4,max:16},bayer8:{matrix:genBayer(8),size:8,max:64},diamond:{matrix:DIAMOND_8X8,size:8,max:8}};
let _hilbert={key:'',order:null};
function hilbertOrder(w,h){const key=w+'x'+h;if(_hilbert.key===key)return _hilbert.order;let n=1;while(n<Math.max(w,h))n*=2;const order=new Int32Array(w*h);let idx=0;
  for(let d=0;d<n*n&&idx<order.length;d++){let t=d,x=0,y=0;for(let s=1;s<n;s*=2){const rx=1&(t>>1),ry=1&(t^rx);if(ry===0){if(rx===1){x=s-1-x;y=s-1-y;}const tmp=x;x=y;y=tmp;}x+=s*rx;y+=s*ry;t>>=2;}if(x<w&&y<h)order[idx++]=y*w+x;}
  _hilbert={key,order};return order;}
const RIEM_N=16,RIEM_W=Array.from({length:RIEM_N},(_,k)=>Math.pow(1/16,k/(RIEM_N-1)));
const ASCII_RAMPS={standard:{chars:' .:-=+*#%@'},blocks:{chars:' ░▒▓█'},numeric:{chars:' 1234567890'},symbols:{chars:' ·∙•◦○●'},code:{chars:' .,;:!?/\\|()[]{}<>'},dense:{chars:" `^\",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$"}};
function luminance([r,g,b]){return(0.299*r+0.587*g+0.114*b)/255;}
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const DIFFUSION_KERNELS={diffusion:{div:16,taps:[[1,0,7],[-1,1,3],[0,1,5],[1,1,1]]},jjn:{div:48,taps:[[1,0,7],[2,0,5],[-2,1,3],[-1,1,5],[0,1,7],[1,1,5],[2,1,3],[-2,2,1],[-1,2,3],[0,2,5],[1,2,3],[2,2,1]]},stucki:{div:42,taps:[[1,0,8],[2,0,4],[-2,1,2],[-1,1,4],[0,1,8],[1,1,4],[2,1,2],[-2,2,1],[-1,2,2],[0,2,4],[1,2,2],[2,2,1]]},sierra:{div:32,taps:[[1,0,5],[2,0,3],[-2,1,2],[-1,1,4],[0,1,5],[1,1,4],[2,1,2],[-1,2,2],[0,2,3],[1,2,2]]}};

function renderDither({img,w,h,px,palette,algo,getY,transparent}){
  const sw=Math.max(1,Math.round(w/px)),sh=Math.max(1,Math.round(h/px));
  const small=document.createElement('canvas');small.width=sw;small.height=sh;
  const sctx=small.getContext('2d');sctx.imageSmoothingEnabled=true;sctx.drawImage(img,0,0,sw,sh);
  const data=sctx.getImageData(0,0,sw,sh).data;const out=new Uint8ClampedArray(sw*sh*4);
  const sorted=[...palette].sort((a,b)=>a.anchor-b.anchor);
  const cols=sorted.map(p=>hexToRgb(p.color));const lums=sorted.map(p=>p.anchor);const bgIdx=cols.length-1;
  const qOrd=(Y,x,y,matrix,size,maxVal)=>{if(Y<=lums[0])return 0;if(Y>=lums[lums.length-1])return lums.length-1;
    for(let k=0;k<lums.length-1;k++){if(Y>=lums[k]&&Y<=lums[k+1]){const t=(lums[k+1]-lums[k])>0?(Y-lums[k])/(lums[k+1]-lums[k]):0;return t>(matrix[y%size][x%size]+0.5)/maxVal?k+1:k;}}return lums.length-1;};
  if(!!ORDERED_PATTERNS[algo]){
    const{matrix,size,max}=ORDERED_PATTERNS[algo];
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=(y*sw+x)*4;const Y=getY(data[i],data[i+1],data[i+2]);const idx=qOrd(Y,x,y,matrix,size,max);const c=cols[idx];out[i]=c[0];out[i+1]=c[1];out[i+2]=c[2];out[i+3]=(transparent&&idx===bgIdx)?0:255;}
  }else if(algo==='riemersma'){
    const gL=lums.map(l=>l*255);const order=hilbertOrder(sw,sh);const hbuf=new Float32Array(RIEM_N);let hp=0;
    for(let n=0;n<order.length;n++){const i=order[n],di=i*4;const base=getY(data[di],data[di+1],data[di+2])*255;let acc=0;for(let k=0;k<RIEM_N;k++)acc+=hbuf[(hp-1-k+RIEM_N)%RIEM_N]*RIEM_W[k];const v=Math.max(0,Math.min(255,base+acc));let best=0,bd=Infinity;for(let k=0;k<gL.length;k++){const d=Math.abs(v-gL[k]);if(d<bd){bd=d;best=k;}}hbuf[hp]=v-gL[best];hp=(hp+1)%RIEM_N;const c=cols[best];out[di]=c[0];out[di+1]=c[1];out[di+2]=c[2];out[di+3]=(transparent&&best===bgIdx)?0:255;}
  }else{
    const work=new Float32Array(sw*sh);for(let i=0;i<sw*sh;i++)work[i]=getY(data[i*4],data[i*4+1],data[i*4+2])*255;const gL=lums.map(l=>l*255);
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=y*sw+x;const v=Math.max(0,Math.min(255,work[i]));let best=0,bestD=Infinity;for(let k=0;k<gL.length;k++){const d=Math.abs(v-gL[k]);if(d<bestD){bestD=d;best=k;}}const err=v-gL[best];const c=cols[best];const oi=i*4;out[oi]=c[0];out[oi+1]=c[1];out[oi+2]=c[2];out[oi+3]=(transparent&&best===bgIdx)?0:255;
      if(algo==='atkinson'){const e=err/8;if(x+1<sw)work[i+1]+=e;if(x+2<sw)work[i+2]+=e;if(x-1>=0&&y+1<sh)work[i+sw-1]+=e;if(y+1<sh)work[i+sw]+=e;if(x+1<sw&&y+1<sh)work[i+sw+1]+=e;if(y+2<sh)work[i+sw*2]+=e;}
      else{const{div,taps}=DIFFUSION_KERNELS[algo]||DIFFUSION_KERNELS.diffusion;for(const[dx,dy,wt]of taps){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<sw&&ny<sh)work[ny*sw+nx]+=err*wt/div;}}}
  }
  sctx.putImageData(new ImageData(out,sw,sh),0,0);
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,sw,sh,0,0,w,h);return canvas;
}
function applyAtmosphere(canvas,{phosphorGlow,luminanceLift,scanlines,noise,chromaShift,darkColor}){
  const ctx=canvas.getContext('2d');const{width:w,height:h}=canvas;
  if(phosphorGlow>0){const g=phosphorGlow/100;const blurPx=g*Math.min(w,h)*0.06;const src=ctx.getImageData(0,0,w,h);const sd=src.data;
    const bright=document.createElement('canvas');bright.width=w;bright.height=h;const brctx=bright.getContext('2d');const bimg=brctx.createImageData(w,h);const bd=bimg.data;const knee=0.5;
    for(let i=0;i<sd.length;i+=4){const v=Math.max(sd[i],sd[i+1],sd[i+2])/255;const wt=v>knee?(v-knee)/(1-knee):0;if(wt>0){bd[i]=sd[i]*wt;bd[i+1]=sd[i+1]*wt;bd[i+2]=sd[i+2]*wt;bd[i+3]=255;}}
    brctx.putImageData(bimg,0,0);const blur=document.createElement('canvas');blur.width=w;blur.height=h;const blctx=blur.getContext('2d');blctx.filter=`blur(${blurPx}px)`;blctx.drawImage(bright,0,0);
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=Math.min(1,g*1.5);ctx.drawImage(blur,0,0);ctx.restore();}
  if(luminanceLift>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(luminanceLift/100)*0.25;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.restore();}
  if(scanlines>0){const k=Math.round((1-(scanlines/100)*0.55)*255);const period=Math.max(2,Math.round(h/450)),thick=Math.max(1,Math.round(period*0.5));ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${k},${k},${k})`;for(let y=0;y<h;y+=period)ctx.fillRect(0,y,w,thick);ctx.restore();}
  if(noise>0){ctx.save();ctx.globalAlpha=0.5;const count=Math.round((noise/100)*w*h*0.04);for(let n=0;n<count;n++){ctx.fillStyle=Math.random()<0.5?darkColor||'#000':'#fff';ctx.fillRect(Math.random()*w,Math.random()*h,1,1);}ctx.restore();}
}
const DETAIL_RANGE={dither:[1,26]};
function detailToSize(mode,detail){const[min,max]=DETAIL_RANGE[mode];const d=Math.max(0,Math.min(100,detail))/100;return max*Math.pow(min/max,d);}
function makeGetY(s){const cf=(100+(s.contrast||0))/100,mid=s.midtones||1,hi=s.highlights||1,sh=s.shadows||1;
  return(r,g,b)=>{let y=luminance([r,g,b]);y=(y-0.5)*cf+0.5;y=Math.pow(Math.max(0,Math.min(1,y)),1/mid);if(y>0.5)y=0.5+(y-0.5)*hi;else y=0.5-(0.5-y)*sh;return Math.max(0,Math.min(1,y));};}
function renderPreset(img,s,w,h){
  const getY=makeGetY(s);const scale=Math.max(0.05,Math.min(1.4,Math.max(w,h)/900));
  const px=Math.max(1,(s.detail!==undefined?detailToSize('dither',s.detail):(s.pixelSize||5))*scale);
  const canvas=renderDither({img,w,h,px,palette:(s.palette||[]).map(p=>({...p})),algo:s.algo||'bayer',getY});
  const darkColor=([...(s.palette||[])].sort((a,b)=>a.anchor-b.anchor)[0]||{}).color||'#000';
  applyAtmosphere(canvas,{phosphorGlow:s.phosphorGlow||0,luminanceLift:s.luminanceLift||0,scanlines:s.scanlines||0,noise:s.noise||0,chromaShift:0,darkColor});
  return canvas;
}
/* ===== Real presets (verbatim settings from LOOK_PRESETS) ===== */
const PRESETS={
  her:{palette:[{color:'#2d0f0f',anchor:0},{color:'#7a3030',anchor:0.2},{color:'#c47850',anchor:0.5},{color:'#e8b090',anchor:0.78},{color:'#faeae0',anchor:1}],algo:'diffusion',contrast:15,midtones:1.3,highlights:0.85,shadows:0.85,phosphorGlow:40},
  dune:{palette:[{color:'#330d0a',anchor:0.07},{color:'#73230e',anchor:0.16},{color:'#b44b12',anchor:0.41},{color:'#df781d',anchor:0.53},{color:'#f39a2b',anchor:0.62},{color:'#fcc95d',anchor:0.73},{color:'#fcd788',anchor:0.82},{color:'#ecdec5',anchor:1}],algo:'diffusion',contrast:-24,midtones:1.1,highlights:1.15,shadows:1.45},
  mgs:{palette:[{color:'#041513',anchor:0.08},{color:'#1a5148',anchor:0.14},{color:'#117449',anchor:0.25},{color:'#3a9862',anchor:0.32},{color:'#83ce92',anchor:0.78},{color:'#a5dfc4',anchor:0.84},{color:'#d0e2da',anchor:0.95}],algo:'diffusion',phosphorGlow:15,luminanceLift:30,scanlines:20},
  gits:{palette:[{color:'#1a1d1f',anchor:0.08},{color:'#21313f',anchor:0.13},{color:'#38658c',anchor:0.25},{color:'#7ac0e3',anchor:0.52},{color:'#7ac0e3',anchor:0.72},{color:'#ddc292',anchor:1}],algo:'diffusion',contrast:-10,midtones:0.75,highlights:1.3,shadows:1.05,phosphorGlow:20,luminanceLift:20},
};

const P=new URLSearchParams(location.search);
const V=P.get('v')||'1';
const IMG=P.get('img')||'1';
const PRE=P.get('p')||'her';
const DETAIL=P.get('d');
const stage=document.getElementById('stage');
const el=(t,c,html)=>{const e=document.createElement(t);if(c)e.className=c;if(html!=null)e.innerHTML=html;return e;};
const brand=(big)=>{const b=el('div','brand');const im=el('img');im.src='icon-512.png';const nm=el('div','nm');nm.innerHTML='<b>Phosphor</b> <span>Studio</span>';if(big){im.style.width=im.style.height='92px';nm.style.fontSize='52px';}b.append(im,nm);return b;};

const img=new Image();
img.onload=()=>{
  const s={...PRESETS[PRE]};if(DETAIL!=null)s.detail=+DETAIL;
  if(V==='1'){                    // full-bleed real preset + bottom gradient
    const c=renderPreset(img,s,1200,630);c.style.left='0';c.style.top='0';stage.append(c);
    const g=el('div');g.style.cssText='position:absolute;inset:0;background:linear-gradient(to top,rgba(8,6,8,.97) 0%,rgba(8,6,8,.7) 20%,rgba(8,6,8,0) 44%)';stage.append(g);
    const wrap=el('div');wrap.style.cssText='position:absolute;left:64px;bottom:60px;display:flex;flex-direction:column;gap:20px';wrap.append(brand(true));stage.append(wrap);
    const u=el('div','url','phosphorstudio.vercel.app');u.style.cssText='position:absolute;right:64px;bottom:66px';stage.append(u);
  } else if(V==='2'){             // top block bar + preset below
    const barH=232;const c=renderPreset(img,s,1200,630-barH);c.style.left='0';c.style.top=barH+'px';stage.append(c);
    const bar=el('div');bar.style.cssText=`position:absolute;left:0;top:0;width:1200px;height:${barH}px;background:#0a0a0c;padding:0 64px;display:flex;flex-direction:column;justify-content:center;gap:16px;border-bottom:1px solid #b45309`;
    bar.append(brand(true));bar.append(el('div','tag','Dithered, halftone &amp; ASCII retro-display art — in your browser.'));stage.append(bar);
    const u=el('div','url','phosphorstudio.vercel.app');u.style.cssText='position:absolute;right:64px;bottom:28px;color:#d4b483;text-shadow:0 1px 4px #000';stage.append(u);
  } else if(V==='4'){             // preset left, poster panel right
    const imgW=740;const c=renderPreset(img,s,imgW,630);c.style.left='0';c.style.top='0';stage.append(c);
    const fade=el('div');fade.style.cssText=`position:absolute;left:${imgW-90}px;top:0;width:120px;height:630px;background:linear-gradient(to right,rgba(10,10,12,0),#0a0a0c)`;stage.append(fade);
    const panel=el('div');panel.style.cssText=`position:absolute;left:${imgW}px;top:0;width:${1200-imgW}px;height:630px;background:#0a0a0c;padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:26px`;
    panel.append(brand(false));panel.append(el('div','tag','A lo-fi visual studio.'));
    const chips=el('div','chips');['Dither','Halftone','ASCII','CRT'].forEach(x=>chips.append(el('span',null,x)));panel.append(chips);
    panel.append(el('div','url','phosphorstudio.vercel.app'));stage.append(panel);
  }
  document.body.dataset.ready='1';
};
img.src='samples/landscape-'+IMG+'.jpg';
</script>
</body>
</html>
